# Fallback project definition for XcodeGen.
#
# EnKisaYolculuk.xcodeproj is checked in and should open directly. This file
# exists only so the project can be regenerated from scratch if that one ever
# breaks or conflicts:
#
#   brew install xcodegen
#   xcodegen generate
#
# It is not needed for day-to-day work.

name: EnKisaYolculuk
options:
  bundleIdPrefix: com.keremozturk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EnKisaYolculuk:
    type: application
    platform: iOS
    sources:
      - path: EnKisaYolculuk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keremozturk.EnKisaYolculuk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
